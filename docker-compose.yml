services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-orchestration-api
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  webhook-retry-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-orchestration-webhook-worker
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      WEBHOOK_RETRY_INTERVAL_SECONDS: 10
      WEBHOOK_RETRY_BATCH_SIZE: 100
    command: ["python", "-m", "app.workers.webhook_retry_worker"]
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: payment-orchestration-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: